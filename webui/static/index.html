<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>录制管理 · DouyinLiveRecorder</title>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f9f9ff" id="meta-theme">
<meta name="application-name" content="DouyinLiveRecorder">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="录制管理">
<meta name="description" content="DouyinLiveRecorder Web 管理面板：任务管理、配置、日志与录制文件查看">
<link rel="stylesheet" href="static/styles.css">
<script type="importmap">
{
  "imports": {
    "lit": "https://cdn.jsdelivr.net/npm/lit@3.3.1/index.js",
    "lit/": "https://cdn.jsdelivr.net/npm/lit@3.3.1/",
    "lit-element/": "https://cdn.jsdelivr.net/npm/lit-element@4.2.1/",
    "lit-html": "https://cdn.jsdelivr.net/npm/lit-html@3.3.1/lit-html.js",
    "lit-html/": "https://cdn.jsdelivr.net/npm/lit-html@3.3.1/",
    "@lit/reactive-element": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.1/reactive-element.js",
    "@lit/reactive-element/": "https://cdn.jsdelivr.net/npm/@lit/reactive-element@2.1.1/",
    "tslib": "https://cdn.jsdelivr.net/npm/tslib@2.8.1/tslib.es6.mjs",
    "@material/web/": "https://cdn.jsdelivr.net/npm/@material/web@2.4.1/"
  }
}
</script>
</head>
<body>
<recorder-app><p class="loading" role="status">正在加载录制管理…</p></recorder-app>
<noscript>请启用 JavaScript 以使用录制管理。</noscript>
<script type="module">
  // Let the worker cache CDN modules on the first successful visit, too.
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('./sw.js');
      await Promise.race([
        navigator.serviceWorker.ready.then(() => navigator.serviceWorker.controller || new Promise(resolve => {
          navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
        })),
        new Promise(resolve => setTimeout(resolve, 2500)),
      ]);
    } catch (error) { console.warn('Service Worker 不可用', error); }
  }
  try {
    await import('./static/app.js');
  } catch (error) {
    document.querySelector('recorder-app').textContent = '界面加载失败，请检查网络与 CDN 连接后刷新页面。';
    console.error(error);
  }
</script>
</body>
</html>
