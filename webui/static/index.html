<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DouyinLiveRecorder WebUI</title>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="application-name" content="DouyinLiveRecorder">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="录制管理">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36; --text: #d8dee9;
    --muted: #7a8291; --accent: #4c8dff; --green: #3fb950; --yellow: #d29922;
    --red: #f85149; --orange: #db6d28;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body { min-width: 320px; background: var(--bg); color: var(--text); font: 14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif; overflow-x: hidden; }
  button, input, select, textarea { font: inherit; }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header h1 { font-size: 20px; }
  header .ver { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .connection { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .connection::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
  .connection.online::before { background: var(--green); box-shadow: 0 0 0 3px rgba(63,185,80,.12); }
  .connection.offline::before { background: var(--red); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .num { font-size: 26px; font-weight: 700; }
  .card .lbl { color: var(--muted); font-size: 12px; margin-top: 2px; }
  nav.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { flex: 0 0 auto; background: none; border: none; color: var(--muted); padding: 10px 18px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  table { width: 100%; border-collapse: collapse; }
  .table-scroll { width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:hover td { background: rgba(255,255,255,.03); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; }
  .b-recording { background: rgba(63,185,80,.15); color: var(--green); }
  .b-waiting, .b-offline { background: rgba(210,153,34,.15); color: var(--yellow); }
  .b-error { background: rgba(248,81,73,.15); color: var(--red); }
  .b-stopped, .b-unknown { background: rgba(122,130,145,.15); color: var(--muted); }
  .btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .9; color: #fff; }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: wait; pointer-events: none; }
  .form-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .form-row input, .form-row select { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .form-row > * { max-width: 100%; }
  .form-row input[type=url] { flex: 1; min-width: 260px; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin: -4px 0 12px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 9px; }
  .toolbar input[type=search] { width: min(280px, 100%); }
  .toolbar .summary { margin-left: auto; color: var(--muted); font-size: 12px; }
  textarea { width: 100%; min-height: 60vh; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px; font-family: "SF Mono",Consolas,monospace; font-size: 12px; resize: vertical; }
  .logs { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; height: 70vh; overflow-y: auto; font-family: Consolas,monospace; font-size: 12px; }
  .logs .row { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.03); white-space: pre-wrap; word-break: break-all; }
  .log-ERROR { color: var(--red); } .log-WARNING { color: var(--yellow); } .log-SUCCESS { color: var(--green); }
  .file-item { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .file-item .path { flex: 1; word-break: break-all; }
  .file-item .size { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .toast { position: fixed; top: 20px; right: 20px; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); padding: 10px 16px; border-radius: 8px; z-index: 99; display: none; }
  .toast.ok { border-left-color: var(--green); } .toast.err { border-left-color: var(--red); }
  .dirty { color: var(--yellow); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #offline-banner { display: none; position: sticky; top: 0; z-index: 98; background: var(--orange); color: #fff; text-align: center; padding: 6px 12px; font-size: 13px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  @media (max-width: 760px) {
    .wrap { padding: 14px; }
    header { gap: 6px 12px; margin-bottom: 14px; }
    header h1 { flex-basis: 100%; font-size: 18px; }
    header .spacer { display: none; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .card { padding: 10px 12px; }
    .card .num { font-size: 22px; }
    nav.tabs { margin-inline: -14px; padding-inline: 14px; }
    nav.tabs button { flex: 1 0 auto; min-height: 44px; padding: 9px 14px; }
    .form-row { align-items: stretch; }
    .form-row input, .form-row select, .form-row .btn { min-height: 42px; }
    #panel-tasks .form-row > * { flex: 1 1 calc(50% - 8px); width: auto !important; min-width: 0 !important; }
    #panel-tasks .form-row #new-id,
    #panel-tasks .form-row #new-url,
    #panel-tasks .form-row .primary { flex-basis: 100%; }
    .toolbar > * { min-height: 40px; }
    .toolbar input[type=search] { flex: 1 1 100%; width: 100%; }
    .toolbar .summary { margin-left: 0; flex: 1; }
    .table-scroll { overflow: visible; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tbody { display: grid; gap: 10px; }
    tbody tr { padding: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
    tbody tr:hover td { background: none; }
    tbody td { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px; padding: 6px 0; border: 0; overflow-wrap: anywhere; }
    tbody td::before { content: attr(data-label); color: var(--muted); font-size: 12px; }
    tbody td:last-child { align-items: start; }
    tbody td:last-child .btn { min-height: 36px; margin: 0 4px 4px 0; padding-inline: 10px; }
    tbody td.empty { display: block; padding: 28px 8px; }
    tbody td.empty::before { display: none; }
    textarea { min-height: 56vh; }
    .logs { height: 62vh; }
    .file-item { flex-wrap: wrap; padding: 10px 4px; }
    .file-item .path { flex: 1 1 calc(100% - 70px); }
    .file-item .size { order: 3; flex: 1; }
    .file-item .btn { min-height: 36px; display: inline-flex; align-items: center; }
    .toast { inset: auto 14px 14px; text-align: center; }
  }
  @media (max-width: 420px) {
    .wrap { padding: 12px; }
    nav.tabs { margin-inline: -12px; padding-inline: 12px; }
    #panel-tasks .form-row > * { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div id="offline-banner">⚠ 当前离线，显示的是最近一次缓存的数据</div>
<div class="wrap">
  <header>
    <h1>📹 DouyinLiveRecorder</h1>
    <span class="ver" id="ver"></span>
    <span class="ver" id="addr"></span>
    <span class="spacer"></span>
    <span class="connection" id="connection">正在连接</span>
    <span class="ver" id="last-update"></span>
  </header>

  <div class="cards">
    <div class="card"><div class="num" id="c-recording">-</div><div class="lbl">录制中</div></div>
    <div class="card"><div class="num" id="c-tasks">-</div><div class="lbl">任务数</div></div>
    <div class="card"><div class="num" id="c-disk">-</div><div class="lbl">磁盘剩余 (GB)</div></div>
    <div class="card"><div class="num" id="c-platforms">-</div><div class="lbl">支持平台</div></div>
  </div>

  <nav class="tabs" role="tablist" aria-label="管理功能">
    <button data-tab="tasks" class="active" role="tab" aria-selected="true">任务管理</button>
    <button data-tab="config" role="tab" aria-selected="false">配置</button>
    <button data-tab="logs" role="tab" aria-selected="false">日志</button>
    <button data-tab="files" role="tab" aria-selected="false">录制文件</button>
  </nav>

  <!-- 任务管理 -->
  <div class="panel active" id="panel-tasks">
    <form class="form-row" id="task-form">
      <select id="new-mode" aria-label="添加方式">
        <option value="platform">🎯 选平台 + 输入ID</option>
        <option value="url">🔗 粘贴完整网址</option>
      </select>
      <select id="new-platform" style="min-width:150px;" aria-label="直播平台">
        <option value="">-- 选择平台 --</option>
      </select>
      <input type="text" id="new-id" placeholder="直播间ID / 用户名" style="width:240px;" aria-label="直播间 ID 或用户名">
      <input type="url" id="new-url" placeholder="直播间 URL，如 https://live.douyin.com/123456" style="display:none; flex:1; min-width:260px;" aria-label="直播间 URL">
      <select id="new-quality" aria-label="录制画质">
        <option value="">默认画质</option><option>原画</option><option>蓝光</option><option>超清</option><option>高清</option><option>标清</option><option>流畅</option>
      </select>
      <input type="text" id="new-name" placeholder="备注（可选）" style="width:120px;" aria-label="任务备注">
      <button class="btn primary" id="add-task" type="submit">添加任务</button>
    </form>
    <div class="toolbar">
      <input type="search" id="task-search" placeholder="搜索主播、平台或 URL" aria-label="搜索任务">
      <select id="task-filter" aria-label="筛选任务状态">
        <option value="all">全部状态</option>
        <option value="recording">录制中</option>
        <option value="waiting">等待/未开播</option>
        <option value="stopped">已暂停</option>
        <option value="error">出错</option>
      </select>
      <button class="btn" id="refresh-tasks" type="button">刷新</button>
      <span class="summary" id="task-summary"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>状态</th><th>主播</th><th>平台</th><th>画质</th><th>已录制</th><th>URL</th><th>操作</th></tr></thead>
        <tbody id="task-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 配置 -->
  <div class="panel" id="panel-config">
    <div class="form-row">
      <button class="btn primary" id="save-config" type="button">保存配置</button>
      <button class="btn" id="reload-config" type="button">重新载入</button>
      <span class="muted" id="config-hint">保存后无需重启：录制进程每轮值守自动重读配置</span>
    </div>
    <textarea id="config-text" spellcheck="false"></textarea>
  </div>

  <!-- 日志 -->
  <div class="panel" id="panel-logs">
    <div class="form-row"><button class="btn" id="refresh-logs" type="button">刷新</button><label class="muted"><input type="checkbox" id="log-autoscroll" checked> 自动滚动</label><span class="muted" id="log-hint"></span></div>
    <div class="logs" id="log-box"></div>
  </div>

  <!-- 录制文件 -->
  <div class="panel" id="panel-files">
    <div class="form-row"><button class="btn" id="refresh-videos" type="button">刷新</button><span class="muted">点击文件名播放 / 右键另存下载</span></div>
    <div id="video-player" style="display:none; margin-bottom: 12px;">
      <video id="player" controls style="width:100%; max-height:480px; background:#000; border-radius:8px;"></video>
    </div>
    <div id="file-list"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const APP_BASE = new URL('./', document.baseURI);
const appUrl = path => new URL(String(path).replace(/^\/+/, ''), APP_BASE).toString();
let tasks = [];
let videos = [];
let activeTab = 'tasks';
let configOriginal = '';
let configDirty = false;
const inFlight = new Set();

// ---------- 工具 ----------
function toast(msg, ok = true) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast ' + (ok ? 'ok' : 'err'); t.style.display = 'block';
  clearTimeout(t._timer); t._timer = setTimeout(() => t.style.display = 'none', 3200);
}
async function request(path, opts = {}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  let r;
  try {
    r = await fetch(appUrl(path), { ...opts, signal: controller.signal });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('请求超时');
    throw e;
  } finally {
    clearTimeout(timer);
  }
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg || `HTTP ${r.status}`);
  }
  return r;
}
async function api(path, opts) { return (await request(path, opts)).json(); }
async function apiText(path, opts) { return (await request(path, opts)).text(); }
async function once(key, worker) {
  if (inFlight.has(key)) return;
  inFlight.add(key);
  try { return await worker(); } finally { inFlight.delete(key); }
}
async function withBusy(button, worker) {
  const old = button.textContent;
  button.disabled = true;
  button.textContent = '处理中…';
  try { return await worker(); } finally { button.disabled = false; button.textContent = old; }
}
function setConnection(online) {
  const el = $('#connection');
  el.textContent = online ? '服务正常' : '连接失败';
  el.className = 'connection ' + (online ? 'online' : 'offline');
}
function markUpdated() {
  $('#last-update').textContent = '更新于 ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function fmtSize(n) {
  if (!n) return '-';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(1) + ' ' + u[i];
}
function fmtDur(sec) {
  sec = Math.floor(sec || 0);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + 'h ' : '') + (h || m ? m + 'm ' : '') + s + 's';
}
const STATUS_LABEL = { recording:'录制中', waiting:'等待检测', offline:'未开播', error:'出错', stopped:'已暂停', unknown:'未知' };
const STATUS_CLASS = new Set(Object.keys(STATUS_LABEL));
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shortUrl(u) { return u.length > 48 ? u.slice(0, 48) + '…' : u; }
function encodePath(base, path) { return appUrl(base + path.split('/').map(encodeURIComponent).join('/')); }

// ---------- 状态 ----------
async function loadStatus() {
  return once('status', async () => {
    try {
      const s = await api('/api/status');
      const version = String(s.version || '');
      $('#ver').textContent = version.startsWith('v') ? version : 'v' + version;
      $('#addr').textContent = location.origin + APP_BASE.pathname.replace(/\/$/, '');
      $('#c-recording').textContent = s.recording_count;
      $('#c-tasks').textContent = s.task_count;
      $('#c-disk').textContent = s.disk_free_gb;
      $('#c-platforms').textContent = s.platform_count;
      setConnection(true); markUpdated();
    } catch (e) { setConnection(false); }
  });
}

// ---------- 任务 ----------
async function loadTasks() {
  return once('tasks', async () => {
    try {
      const d = await api('/api/tasks');
      tasks = d.tasks || [];
      renderTasks();
    } catch (e) { toast('加载任务失败: ' + e.message, false); }
  });
}
function renderTasks() {
  const query = $('#task-search').value.trim().toLowerCase();
  const filter = $('#task-filter').value;
  const filtered = tasks.filter(t => {
    const status = t.commented ? 'stopped' : (t.status || 'unknown');
    const statusMatch = filter === 'all' || status === filter ||
      (filter === 'waiting' && ['waiting', 'offline', 'unknown'].includes(status));
    const haystack = [t.anchor, t.name, t.platform, t.url].join(' ').toLowerCase();
    return statusMatch && (!query || haystack.includes(query));
  });
  const tb = $('#task-tbody');
  tb.innerHTML = '';
  $('#task-summary').textContent = `显示 ${filtered.length} / ${tasks.length} 个任务`;
  if (!filtered.length) {
    const message = tasks.length ? '没有符合筛选条件的任务' : '暂无任务，请在上方添加直播间 URL';
    tb.innerHTML = `<tr><td colspan="7" class="empty">${message}</td></tr>`;
    return;
  }
  for (const t of filtered) {
      const tr = document.createElement('tr');
      const rawStatus = t.commented ? 'stopped' : (t.status || 'unknown');
      const st = STATUS_CLASS.has(rawStatus) ? rawStatus : 'unknown';
      const badge = `<span class="badge b-${st}">${t.commented ? '已暂停' : (STATUS_LABEL[rawStatus] || '未知')}</span>`;
      const playBtn = t.file ? '<button class="btn sm" data-action="play" type="button">播放</button>' : '';
      tr.innerHTML = `
        <td data-label="状态">${badge}</td>
        <td data-label="主播">${esc(t.anchor || t.name || '-')}${t.recording_seconds ? `<div class="muted">${fmtDur(t.recording_seconds)}</div>` : ''}</td>
        <td data-label="平台">${esc(t.platform || '-')}</td>
        <td data-label="画质">${esc(t.quality)}</td>
        <td data-label="已录制" class="muted">${t.recording_seconds ? fmtDur(t.recording_seconds) : '-'}</td>
        <td data-label="URL"><span class="muted" title="${esc(t.url)}">${esc(shortUrl(t.url))}</span></td>
        <td data-label="操作">
          <button class="btn sm" data-action="toggle" data-commented="${!t.commented}" type="button">${t.commented ? '恢复' : '暂停'}</button>
          <button class="btn sm danger" data-action="remove" type="button">删除</button>
          ${playBtn}
        </td>`;
      tr.querySelectorAll('[data-action]').forEach(button => {
        button.dataset.url = t.url;
        if (t.file) button.dataset.path = t.file;
      });
      tb.appendChild(tr);
  }
}

// ---------- 平台/ID 快捷添加 ----------
let platforms = [];
async function loadPlatforms() {
  try {
    const d = await api('/api/platforms');
    platforms = d.platforms;
    const sel = $('#new-platform');
    sel.innerHTML = '<option value="">-- 选择平台 --</option>';
    for (const p of d.platforms) {
      if (!p.url_template) continue;  // 无 ID 模板的平台走「粘贴完整网址」
      const opt = document.createElement('option');
      opt.value = p.name;
      opt.textContent = p.name;
      sel.appendChild(opt);
    }
  } catch (e) { toast('加载平台列表失败: ' + e.message, false); }
}
function switchMode() {
  const mode = $('#new-mode').value;
  $('#new-platform').style.display = mode === 'platform' ? '' : 'none';
  $('#new-id').style.display = mode === 'platform' ? '' : 'none';
  $('#new-url').style.display = mode === 'url' ? '' : 'none';
}
function onPlatformChange() {
  const p = platforms.find(x => x.name === $('#new-platform').value);
  $('#new-id').placeholder = p && p.id_placeholder ? p.id_placeholder : '直播间ID / 用户名';
}
async function addTask(event) {
  event.preventDefault();
  const mode = $('#new-mode').value;
  const quality = $('#new-quality').value;
  const name = $('#new-name').value.trim();
  const button = $('#add-task');
  await withBusy(button, async () => { try {
    if (mode === 'platform') {
      const platform = $('#new-platform').value;
      const id = $('#new-id').value.trim();
      if (!platform) return toast('请选择平台', false);
      if (!id) return toast('请输入直播间ID/用户名', false);
      await api('/api/tasks/from-id', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ platform, id, quality, name }) });
    } else {
      const url = $('#new-url').value.trim();
      if (!url) return toast('请输入 URL', false);
      await api('/api/tasks', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ url, quality, name }) });
    }
    toast('任务已添加');
    $('#new-id').value = ''; $('#new-url').value = '';
    await Promise.all([loadTasks(), loadStatus()]);
  } catch (e) { toast('添加失败: ' + e.message, false); } });
}
async function removeTask(url, button) {
  if (!confirm('确认删除该任务？')) return;
  await withBusy(button, async () => { try {
    await api('/api/tasks?url=' + encodeURIComponent(url), { method: 'DELETE' });
    toast('已删除'); await Promise.all([loadTasks(), loadStatus()]);
  } catch (e) { toast('删除失败: ' + e.message, false); } });
}
async function toggleTask(url, commented, button) {
  await withBusy(button, async () => { try {
    await api(`/api/tasks/comment?url=${encodeURIComponent(url)}&commented=${commented}`, { method: 'PUT' });
    await loadTasks();
  } catch (e) { toast('操作失败: ' + e.message, false); } });
}

// ---------- 配置 ----------
async function loadConfig(force = false) {
  if (configDirty && !force && !confirm('当前配置尚未保存，确认重新载入吗？')) return;
  return once('config', async () => { try {
    configOriginal = await apiText('/api/config');
    $('#config-text').value = configOriginal;
    setConfigDirty(false);
  } catch (e) { toast('加载配置失败: ' + e.message, false); } });
}
function setConfigDirty(dirty) {
  configDirty = dirty;
  const hint = $('#config-hint');
  hint.textContent = dirty ? '有未保存的更改' : '保存后无需重启：录制进程每轮值守自动重读配置';
  hint.className = dirty ? 'dirty' : 'muted';
}
async function saveConfig(button) {
  await withBusy(button, async () => { try {
    await api('/api/config', { method: 'PUT', headers: {'Content-Type':'text/plain'}, body: $('#config-text').value });
    configOriginal = $('#config-text').value;
    setConfigDirty(false);
    toast('配置已保存，新开任务自动生效');
  } catch (e) { toast('保存失败: ' + e.message, false); } });
}

// ---------- 日志 ----------
async function loadLogs() {
  if (activeTab !== 'logs') return;
  return once('logs', async () => { try {
    const d = await api('/api/logs?limit=300');
    const box = $('#log-box');
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 48;
    box.innerHTML = '';
    if (!d.logs.length) { box.innerHTML = '<div class="empty">暂无日志</div>'; return; }
    for (const l of d.logs) {
      const row = document.createElement('div');
      const time = new Date(l.time * 1000).toLocaleTimeString();
      row.className = 'row log-' + (l.level || 'INFO');
      row.textContent = `[${time}] [${l.level}] ${l.message}`;
      box.appendChild(row);
    }
    if ($('#log-autoscroll').checked || nearBottom) box.scrollTop = box.scrollHeight;
    $('#log-hint').textContent = `${d.logs.length} 条 · ${new Date().toLocaleTimeString()}`;
  } catch (e) { toast('加载日志失败: ' + e.message, false); } });
}

// ---------- 录制文件 ----------
async function loadVideos() {
  return once('videos', async () => { try {
    const d = await api('/api/videos');
    videos = (d.files || []).sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
    renderVideos();
  } catch (e) { toast('加载文件失败: ' + e.message, false); } });
}
function renderVideos() {
    const box = $('#file-list');
    box.innerHTML = '';
    if (!videos.length) { box.innerHTML = '<div class="empty">暂无录制文件</div>'; return; }
    // 按路径分组显示
    const groups = {};
    for (const f of videos) {
      const parts = f.path.split('/');
      const key = parts.length > 1 ? parts.slice(0, -1).join('/') : '根目录';
      (groups[key] = groups[key] || []).push(f);
    }
    for (const [dir, files] of Object.entries(groups)) {
      const h = document.createElement('div');
      h.innerHTML = `<div style="margin:10px 0 4px;color:var(--accent);font-weight:600;">📁 ${esc(dir)}</div>`;
      box.appendChild(h);
      for (const f of files) {
        const div = document.createElement('div');
        div.className = 'file-item';
        const path = f.path.split('/').map(encodeURIComponent).join('/');
        const playPath = encodePath('/api/videos/play/', f.path);
        div.innerHTML = `<a class="path" href="${playPath}" data-play>${esc(f.name)}</a>
          <span class="size">${fmtSize(f.size)}</span>
          <a class="btn sm" href="${appUrl('/videos/' + path)}" download>下载</a>`;
        div.querySelector('[data-play]').dataset.path = f.path;
        box.appendChild(div);
      }
    }
}
function playVideo(path) {
  const filesTab = document.querySelector('nav.tabs button[data-tab="files"]');
  if (filesTab && !filesTab.classList.contains('active')) filesTab.click();
  const wrap = $('#video-player');
  wrap.style.display = 'block';
  const player = $('#player');
  player.pause();
  player.removeAttribute('src');
  player.load();
  player.src = encodePath('/api/videos/play/', path);
  player.play().catch(() => {});
}

// ---------- Tab ----------
document.querySelectorAll('nav.tabs button').forEach(b => {
  b.onclick = () => {
    activeTab = b.dataset.tab;
    document.querySelectorAll('nav.tabs button').forEach(x => {
      x.classList.toggle('active', x === b);
      x.setAttribute('aria-selected', x === b ? 'true' : 'false');
    });
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    $('#panel-' + activeTab).classList.add('active');
    if (activeTab === 'config' && !configOriginal && !configDirty) loadConfig();
    if (activeTab === 'logs') loadLogs();
    if (activeTab === 'files') loadVideos();
  };
});

// ---------- PWA ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register(appUrl('/sw.js')).then(reg => {
      console.log('ServiceWorker 已注册:', reg.scope);
    }).catch(err => {
      console.warn('ServiceWorker 注册失败（需 HTTPS 或 localhost）:', err);
    });
  });
}
function updateNet() {
  const b = $('#offline-banner');
  b.style.display = navigator.onLine ? 'none' : 'block';
  if (!navigator.onLine) setConnection(false);
}
window.addEventListener('offline', updateNet);
window.addEventListener('online', () => { updateNet(); loadStatus(); loadTasks(); });
updateNet();

// ---------- 轮询 ----------
loadStatus(); loadTasks(); loadPlatforms();
$('#new-mode').onchange = switchMode;
$('#new-platform').onchange = onPlatformChange;
$('#task-form').onsubmit = addTask;
$('#task-search').oninput = renderTasks;
$('#task-filter').onchange = renderTasks;
$('#refresh-tasks').onclick = () => { loadStatus(); loadTasks(); };
$('#task-tbody').onclick = event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  if (button.dataset.action === 'remove') removeTask(button.dataset.url, button);
  if (button.dataset.action === 'toggle') toggleTask(button.dataset.url, button.dataset.commented === 'true', button);
  if (button.dataset.action === 'play') playVideo(button.dataset.path);
};
$('#save-config').onclick = event => saveConfig(event.currentTarget);
$('#reload-config').onclick = () => loadConfig();
$('#config-text').oninput = () => setConfigDirty($('#config-text').value !== configOriginal);
$('#refresh-logs').onclick = loadLogs;
$('#refresh-videos').onclick = loadVideos;
$('#file-list').onclick = event => {
  const link = event.target.closest('[data-play]');
  if (!link) return;
  event.preventDefault(); playVideo(link.dataset.path);
};
window.addEventListener('beforeunload', event => {
  if (!configDirty) return;
  event.preventDefault(); event.returnValue = '';
});
switchMode();
setInterval(() => {
  if (document.hidden || !navigator.onLine) return;
  loadStatus();
  if (activeTab === 'tasks') loadTasks();
  if (activeTab === 'logs') loadLogs();
}, 5000);
</script>
</body>
</html>
